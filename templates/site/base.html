
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Distribuidora{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loja.css') }}">
</head>

<body>
<div class="store-shell">
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark"><i class="bi bi-basket2-fill"></i></span>
                <span>Distribuidora<small>CATÁLOGO LOCAL</small></span>
            </a>

            <form class="site-search" action="{{ url_for('produtos') }}" method="get" role="search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input type="search" name="q" value="{{ request.args.get('q', '') }}"
                       placeholder="Busque produtos ou categorias" aria-label="Buscar produtos ou categorias">
                <button type="submit">Buscar</button>
            </form>

            <nav class="site-nav" aria-label="Navegação principal">
                <a class="{% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Início</a>
                <a class="{% if request.endpoint in ['categorias', 'verCategoria'] %}active{% endif %}" href="{{ url_for('categorias') }}">Categorias</a>
                <a class="{% if request.endpoint == 'produtos' %}active{% endif %}" href="{{ url_for('produtos') }}">Produtos</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <a class="footer-brand" href="{{ url_for('home') }}"><i class="bi bi-basket2-fill"></i> Distribuidora</a>
        <span>Consulte nosso catálogo de produtos e categorias.</span>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
